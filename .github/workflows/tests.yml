name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BILLING_TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://postgres:postgres@localhost:5432/billing_test' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend served by the web tests
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - name: Migrate an empty database to head
        if: matrix.database == 'postgresql'
        env:
          BILLING_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/billing_test
        run: alembic upgrade head
      - run: pytest -q
